<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VRT playground — basic</title>
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/theme.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="title">Playground</h1>
      <button class="action" type="button">Save</button>
    </header>

    <main class="grid">
      <article class="card">
        <h2 class="card-title">First</h2>
        <p class="card-body">
          Layout, color and presence are all decided by theme.css.
        </p>
      </article>
      <article class="card">
        <h2 class="card-title">Second</h2>
        <p class="card-body">The markup never changes between runs.</p>
      </article>
      <article class="card">
        <h2 class="card-title">Third</h2>
        <p class="card-body">Only the stylesheet the server hands back does.</p>
      </article>
    </main>

    <footer class="footer">basic</footer>
  </body>
</html>
